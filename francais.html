    :root {
      --ink: #16324f;
      --muted: #65758b;
      --purple: #7c4dff;
      --blue: #4c6ef5;
      --coral: #ff5d8f;
      --coral-dark: #d93b70;
      --aqua: #36d1c4;
      --green: #2d9d78;
      --red: #c9463d;
      --shadow: 0 18px 48px rgba(25, 50, 74, .14);
      --cursive: "Playwrite FR", "Segoe Script", "Apple Chancery", cursive;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 216, 77, .8) 0 7%, transparent 24%),
        radial-gradient(circle at 92% 18%, rgba(255, 93, 143, .35) 0 9%, transparent 27%),
        radial-gradient(circle at 82% 88%, rgba(54, 209, 196, .35) 0 10%, transparent 30%),
        linear-gradient(145deg, #efe9ff 0%, #fff4dc 48%, #e9fbff 100%);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }

    .app {
      height: 100svh;
      display: flex;
      flex-direction: column;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    }
    header {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; padding: 2px 2px 10px;
    }
    .home-link {
      display: inline-flex; align-items: center; gap: 5px; padding: 8px 13px; border-radius: 999px;
      background: rgba(255, 255, 255, .75); border: 1px solid rgba(22, 50, 79, .1);
      box-shadow: 0 5px 16px rgba(46, 37, 98, .08); color: var(--ink); text-decoration: none; font-weight: 800; font-size: .85rem;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 850; letter-spacing: -.02em; }
    .mark {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; color: white; font-weight: 900;
      background: linear-gradient(145deg, var(--coral), #ff8fb2); box-shadow: 0 6px 0 rgba(217, 59, 112, .25); transform: rotate(-3deg);
    }
    .icon-btn {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px;
      border: 1px solid rgba(22, 50, 79, .1); background: rgba(255, 255, 255, .75);
      box-shadow: 0 5px 16px rgba(46, 37, 98, .08); font-size: 1.1rem; cursor: pointer;
    }

    main { flex: 1 1 auto; min-height: 0; display: flex; }
    .panel {
      position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column;
      padding: clamp(14px, 3.2vmin, 30px); border: 3px solid rgba(255, 255, 255, .86); border-radius: 28px;
      background: rgba(255, 255, 255, .92); box-shadow: var(--shadow); overflow: hidden;
    }
    .panel::before {
      content: ""; position: absolute; width: 150px; height: 150px; border-radius: 38px;
      background: rgba(255, 209, 102, .34); top: -82px; right: -60px; transform: rotate(22deg);
    }
    .panel::after {
      content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%;
      background: rgba(54, 209, 196, .15); left: -64px; bottom: -58px;
    }
    .screen {
      position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .screen.scrolly { justify-content: flex-start; overflow-y: auto; }
    .hidden { display: none !important; }

    h1 {
      margin: 0; font-size: clamp(1.6rem, 6.6vmin, 3rem); line-height: 1.02; letter-spacing: -.05em; text-wrap: balance;
      background: linear-gradient(100deg, #4433aa, var(--purple) 52%, var(--coral));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .eyebrow { margin: 0 0 10px; color: var(--muted); font-weight: 800; font-size: .9rem; text-transform: uppercase; letter-spacing: .07em; }
    .intro-copy { max-width: 440px; margin: 10px auto 16px; font-size: clamp(.98rem, 3.4vmin, 1.12rem); line-height: 1.45; color: var(--muted); }

    .primary, .secondary {
      width: min(100%, 360px); min-height: 52px; border: 0; border-radius: 16px; font-weight: 850; cursor: pointer;
    }
    .primary {
      color: white; background: linear-gradient(110deg, var(--purple), var(--coral));
      box-shadow: 0 7px 0 var(--coral-dark); transition: transform .16s ease, box-shadow .16s ease;
    }
    .primary:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--coral-dark); }
    .primary:disabled { opacity: .45; cursor: default; }
    .primary:disabled:active { transform: none; box-shadow: 0 7px 0 var(--coral-dark); }
    .secondary { color: var(--ink); background: #eef3f7; margin-top: 12px; }
    .link-btn { border: 0; background: none; color: var(--coral-dark); font-weight: 800; cursor: pointer; padding: 8px 10px; border-radius: 12px; }

    /* ---- lesson picker ---- */
    .lesson-grid {
      width: 100%; display: grid; gap: 10px; padding: 4px 2px 8px;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
    }
    .lcard {
      position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left;
      padding: 12px 12px 10px; border-radius: 18px; border: 2px solid #fff; cursor: pointer;
      background: #fff; box-shadow: 0 8px 20px rgba(25, 50, 74, .1); color: var(--ink);
    }
    .lcard:active { transform: translateY(1px); }
    .lnum {
      display: grid; place-items: center; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 11px;
      background: var(--c); color: #fff; font-weight: 900; font-size: 1rem;
    }
    .ltitle { font-weight: 850; font-size: .98rem; line-height: 1.2; }
    .lstars { font-size: .95rem; letter-spacing: 1px; color: #f5b301; }
    .lstars .off { color: #d9dee6; }
    @media (max-width: 440px) {
      .lesson-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .lcard { padding: 10px; }
      .ltitle { font-size: .9rem; }
    }

    /* ---- lesson (notebook page) ---- */
    #lessonScreen { justify-content: flex-start; }
    .lesson-scroll {
      flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; text-align: left;
      border-radius: 16px; border: 1px solid #e7e2d3;
      background: linear-gradient(90deg, transparent 30px, rgba(232, 120, 120, .45) 30px, rgba(232, 120, 120, .45) 32px, transparent 32px), #fffef8;
      padding: 14px 14px 18px 42px;
    }
    .lesson-text { font-family: var(--cursive); font-weight: 300; color: #1c2a3a; font-size: clamp(.98rem, 3.6vmin, 1.2rem); line-height: 2.05; }
    .lesson-text h2 {
      margin: 0 0 10px; font-family: var(--cursive); font-weight: 400; text-align: center;
      font-size: clamp(1.15rem, 4.4vmin, 1.55rem); text-decoration: underline; text-underline-offset: 7px;
    }
    .lesson-text .lline { margin: 0 0 6px; padding: 0 8px; border-radius: 10px; cursor: pointer; transition: background .2s; }
    .lesson-text .lline.ex { padding-left: 22px; }
    .lesson-text .lline.li::before { content: "•"; margin-right: 8px; }
    .lesson-text .lline.reading { background: #fff0b8; }
    .lesson-text b { font-weight: 400; color: #08121e; }
    .lesson-text u { text-underline-offset: 5px; }
    .lesson-text mark { color: inherit; padding: 0 3px; border-radius: 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    .hl-o { background: rgba(255, 170, 80, .5); }
    .hl-p { background: rgba(255, 105, 180, .38); }
    .pbadge {
      display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; margin-left: 4px; border-radius: 50%;
      font-family: ui-rounded, -apple-system, sans-serif; font-weight: 900; color: #fff; background: var(--coral); line-height: 1;
    }
    .lesson-text .lbox { margin: 10px 0 6px; padding: 6px 4px; border: 2px solid #1c2a3a; border-radius: 8px; }
    .ltable { width: 100%; border-collapse: collapse; margin: 6px 0 12px; font-size: .95em; }
    .ltable td { border: 1.5px solid #1c2a3a; padding: 0 8px; }
    .lesson-actions { flex: 0 0 auto; display: flex; gap: 10px; width: min(100%, 460px); padding-top: 12px; }
    .lesson-actions button { flex: 1; width: auto; margin-top: 0; }

    /* ---- game ---- */
    #gameScreen { justify-content: flex-start; }
    .game-top { flex: 0 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .chip-btn {
      min-width: 44px; height: 42px; padding: 0 12px; border-radius: 999px; border: 0; cursor: pointer;
      background: #eef3f7; color: var(--ink); font-weight: 850; font-size: .95rem; white-space: nowrap; flex-shrink: 0;
    }
    .progress { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .q-count { font-weight: 850; color: var(--muted); font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; }
    .dots { display: flex; gap: 5px; }
    .dots i { width: 11px; height: 11px; border-radius: 50%; background: #dfe5ec; }
    .dots i.now { background: #b9a6ff; }
    .dots i.good { background: var(--green); }
    .dots i.bad { background: var(--coral); }
    .q-ask { flex: 0 0 auto; margin: 10px 0 4px; font-weight: 850; color: var(--purple); font-size: clamp(1rem, 3.8vmin, 1.25rem); line-height: 1.3; text-wrap: balance; }
    .q-stage {
      flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: clamp(10px, 2.4vmin, 18px); padding: 6px 2px;
    }
    .q-emoji { font-size: clamp(2.6rem, 11vmin, 4.4rem); line-height: 1.1; }
    .q-prompt { margin: 0; font-size: clamp(1.35rem, 5.6vmin, 2.3rem); font-weight: 850; line-height: 1.3; max-width: 600px; text-wrap: balance; }
    .q-prompt.long { font-size: clamp(1rem, 3.8vmin, 1.3rem); font-weight: 750; line-height: 1.5; text-align: left; }
    .blank { display: inline-block; min-width: 2.4em; border-bottom: 3px dashed var(--purple); text-align: center; }
    .blank.filled { border-bottom-style: solid; color: var(--green); min-width: 0; padding: 0 2px; }
    .blank.filled.empty { min-width: 1.2em; border-bottom-color: var(--green); }

    .sent { margin: 0; font-size: clamp(1.25rem, 5vmin, 2rem); font-weight: 800; line-height: 2; max-width: 620px; }
    .sent .w { padding: 2px 2px; border-radius: 8px; }
    .sent .punct { margin-left: -2px; }
    .sent.tappable .w { cursor: pointer; }
    @media (hover: hover) { .sent.tappable .w:hover { background: #f1edff; } }
    .chunk.ul { text-decoration: underline 3px var(--ink); text-underline-offset: 7px; }
    .chunk.mk-V { text-decoration: underline 4px var(--coral); text-underline-offset: 8px; }
    .chunk.mk-S, .chunk.mk-T { border-radius: 999px; box-shadow: 0 0 0 3px var(--blue); -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 2px 0; }
    .sent.letters { letter-spacing: 0; }
    .sent.letters .w { display: inline-grid; place-items: center; min-width: 1.7em; margin: 3px 2px; padding: 4px 8px; background: #f3f0ff; border-radius: 12px; text-decoration: none; }
    /* selected / marked states come last so they beat the letter-tile and hover styles */
    .sent .chunk.sel .w { background: var(--purple); color: #fff; box-shadow: 0 3px 0 #5631c9; }
    .sent .chunk.mk-good .w { background: #c9f2dc; color: #135c43; box-shadow: none; }
    .sent .chunk.mk-bad .w { background: #ffd0d9; color: #8f1f2e; box-shadow: none; text-decoration: line-through 2px var(--red); }
    .sent .chunk.mk-show .w { background: #fff1c2; box-shadow: none; }

    .opts { display: grid; gap: 10px; width: min(100%, 540px); grid-template-columns: repeat(var(--cols, 2), 1fr); }
    .opt {
      min-height: 52px; padding: 8px 10px; border-radius: 16px; border: 2px solid #e3dcfb; background: #fff;
      color: var(--ink); font-weight: 850; font-size: clamp(1.05rem, 4vmin, 1.35rem); cursor: pointer; box-shadow: 0 4px 0 #e3dcfb;
    }
    .opt:active { transform: translateY(2px); box-shadow: 0 2px 0 #e3dcfb; }
    .opt.long { text-align: left; font-size: clamp(.92rem, 3.4vmin, 1.08rem); font-weight: 750; line-height: 1.35; }
    .opt.big { font-size: clamp(1.8rem, 7vmin, 2.6rem); line-height: 1; }
    .opt.big small { display: block; margin-top: 4px; font-size: .8rem; font-weight: 800; color: var(--muted); }
    .opt.good { background: #c9f2dc; border-color: var(--green); box-shadow: 0 4px 0 rgba(45, 157, 120, .5); }
    .opt.bad { background: #ffd0d9; border-color: var(--red); box-shadow: 0 4px 0 rgba(201, 70, 61, .45); }
    .opt:disabled { cursor: default; }
    .opt:disabled:not(.good):not(.bad) { opacity: .55; }

    .ord { width: min(100%, 620px); display: flex; flex-direction: column; gap: 10px; }
    .ord-line, .ord-pool { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; min-height: 58px; padding: 8px; border-radius: 16px; }
    .ord-line { border: 2px dashed #cfc4f7; background: #faf8ff; }
    .ord.block .ord-line, .ord.block .ord-pool { flex-direction: column; align-items: stretch; }
    .tile {
      padding: 8px 14px; border-radius: 12px; border: 2px solid #d8cff9; background: #fff; color: var(--ink);
      font-weight: 800; font-size: clamp(1.05rem, 4.2vmin, 1.45rem); box-shadow: 0 3px 0 #d8cff9; cursor: pointer;
    }
    .ord.block .tile { text-align: left; font-size: clamp(.92rem, 3.4vmin, 1.1rem); font-weight: 750; line-height: 1.35; }
    .ord.done .tile { cursor: default; }
    .ord.good .ord-line { border-color: var(--green); background: #e6f8ef; }
    .ord.bad .ord-line { border-color: var(--red); background: #fff0f3; }

    .q-foot { flex: 0 0 auto; width: 100%; min-height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding-top: 8px; }
    .fb { margin: 0; font-weight: 850; font-size: clamp(.98rem, 3.6vmin, 1.12rem); line-height: 1.35; }
    .fb.good { color: var(--green); }
    .fb.bad { color: var(--red); }
    .fb .ans { color: var(--ink); }
    .fb small { display: block; color: var(--muted); font-weight: 750; margin-top: 2px; }
    .q-foot .primary { min-height: 50px; }

    .overlay {
      position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; gap: 10px;
      padding: clamp(14px, 3.2vmin, 30px); background: rgba(255, 255, 255, .98);
    }
    .overlay-top { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

    /* ---- end ---- */
    .trophy { display: block; margin: 4px auto 6px; font-size: clamp(3.2rem, 12vmin, 5rem); animation: trophyPop .75s cubic-bezier(.2,.9,.3,1.35) both; }
    .score-big { margin: 4px 0 0; font-size: clamp(1.4rem, 5.6vmin, 2rem); font-weight: 900; color: var(--purple); }
    .stars-big { font-size: clamp(1.8rem, 7vmin, 2.6rem); letter-spacing: 4px; color: #f5b301; }
    .stars-big .off { color: #dfe4ea; }
    .mistake-block { width: min(100%, 520px); margin: 12px auto 14px; text-align: left; }
    .mistake-title { margin: 0 0 8px; font-weight: 850; text-align: center; }
    .mrow { padding: 8px 12px; margin-bottom: 6px; border-radius: 12px; background: #fff3f6; border: 2px solid rgba(217, 59, 112, .15); }
    .mrow .mq { font-weight: 750; font-size: .95rem; color: var(--muted); }
    .mrow .ma { font-weight: 850; color: var(--ink); }
    .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .confetti i { position: absolute; top: -24px; left: var(--x); width: 10px; height: 20px; border-radius: 4px; background: var(--c); animation: confettiFall var(--d) linear var(--delay) infinite; }
    @keyframes trophyPop { from { opacity: 0; transform: scale(.45) rotate(-16deg); } }
    @keyframes confettiFall { to { transform: translateY(720px) rotate(700deg); } }

    /* ---- reactions ---- */
    .reaction-layer { position: absolute; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
    .creature { position: absolute; font-size: clamp(2.6rem, 11vmin, 5rem); filter: drop-shadow(0 8px 10px rgba(44,34,86,.18)); }
    .creature.good-pop { animation: happyPop 1.6s cubic-bezier(.2,.85,.35,1) both; }
    .creature.skunk-run { animation: skunkRun 1.7s ease-in-out both; }
    .creature.puff { font-size: clamp(1.8rem, 8vmin, 3.4rem); animation: puffAway 1.5s ease-out both; }
    .reaction-label {
      position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 11px 20px; border: 4px solid #fff;
      border-radius: 999px; color: #fff; font-weight: 950; white-space: nowrap; font-size: clamp(1.1rem, 5.5vmin, 1.9rem);
      box-shadow: 0 12px 28px rgba(63,40,140,.24); z-index: 31; animation: labelPop 1.6s ease both;
    }
    .reaction-label.good { background: linear-gradient(110deg, var(--purple), var(--coral)); }
    .reaction-label.bad { background: linear-gradient(110deg, #59616b, #8c6a55); }
    @keyframes happyPop { 0% { opacity: 0; transform: translateY(130px) scale(.3) rotate(-18deg); } 35% { opacity: 1; transform: translateY(-14px) scale(1.1) rotate(8deg); } 75% { opacity: 1; transform: translateY(4px) scale(1) rotate(-4deg); } 100% { opacity: 0; transform: translateY(-120px) scale(.8) rotate(12deg); } }
    @keyframes skunkRun { 0% { opacity: 0; transform: translateX(-130px) rotate(-8deg); } 20%, 75% { opacity: 1; } 45% { transform: translateX(20px) rotate(8deg); } 100% { opacity: 0; transform: translateX(170px) rotate(-5deg); } }
    @keyframes puffAway { 0% { opacity: 0; transform: translate(0, 25px) scale(.4); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-80px, -95px) scale(1.5) rotate(18deg); } }
    @keyframes labelPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.35); } 25%, 75% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.85); } }
    @media (prefers-reduced-motion: reduce) {
      .trophy, .confetti i, .creature, .reaction-label { animation: none !important; }
      .primary:active { transform: none; }
    }

    /* ---- corrections sheet (screen preview + print) ---- */
    #sheetScreen { justify-content: flex-start; }
    .sheet-wrap { flex: 1 1 auto; min-height: 0; width: 100%; overflow-y: auto; padding: 4px 4px 10px; }
    .sheet {
      width: min(100%, 660px); margin: 0 auto; padding: 22px 20px 26px; text-align: left; color: #1b2733;
      background: #fff; border: 1px solid #e3e8ee; border-radius: 12px; box-shadow: 0 6px 22px rgba(25, 50, 74, .14);
    }
    .sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; padding-bottom: 8px; border-bottom: 2px solid #1b2733; }
    .sheet-title { font-size: 1.5rem; font-weight: 900; letter-spacing: -.02em; }
    .sheet-meta { color: #4a5868; font-weight: 700; font-size: .9rem; }
    .sheet-lesson { margin: 12px 0 4px; padding: 8px 12px; border: 2px solid #1b2733; border-radius: 10px; }
    .sheet-lesson .lesson-text { font-size: .92rem; line-height: 1.85; }
    .sheet-lesson .lesson-text h2 { font-size: 1.05rem; margin-bottom: 4px; }
    .sheet-lesson .lesson-text .lline { cursor: default; margin-bottom: 2px; }
    .sheet-instr { margin: 12px 0 10px; font-weight: 750; font-size: 1rem; }
    .sheet-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .sheet-table col.c-q { width: 38%; }
    .sheet-table col.c-a { width: 27%; }
    .sheet-table th { padding: 4px 6px; border: 1.5px solid #1b2733; background: #f3f5f8; color: #4a5868; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
    .sheet-table td { padding: 6px 8px; border: 1.5px solid #1b2733; vertical-align: middle; font-size: .95rem; line-height: 1.35; overflow-wrap: anywhere; }
    .sheet-table td small { display: block; color: #5b6878; font-size: .78rem; margin-bottom: 2px; }
    .sheet-table td.sa { font-weight: 850; }
    .sheet-table td.sc { vertical-align: bottom; height: 62px; }
    .sheet-table .ln { position: relative; height: 34px; border-bottom: 1.5px solid #7d8a99; }
    .sheet-table .ln::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed #b9c2cc; }
    .sheet-actions { flex: 0 0 auto; display: flex; gap: 10px; width: min(100%, 460px); margin: 0 auto; padding-top: 12px; }
    .sheet-actions button { flex: 1; width: auto; margin-top: 0; }
    .print-area { display: none; }

    @media print {
      @page { size: A4 portrait; margin: 14mm; }
      html, body { height: auto !important; overflow: visible !important; background: #fff !important; }
      body.sheet-mode .app { display: none !important; }
      body.sheet-mode .print-area { display: block !important; }
      .print-area .sheet { width: 100%; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      .print-area .sheet-title { font-size: 20pt; }
      .print-area .sheet-meta { font-size: 10pt; }
      .print-area .sheet-lesson { break-inside: avoid; page-break-inside: avoid; }
      .print-area .sheet-lesson .lesson-text { font-size: 10.5pt; }
      .print-area .lesson-text mark, .print-area .pbadge, .print-area .sheet-table th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .print-area .sheet-instr { font-size: 12pt; }
      .print-area .sheet-table thead { display: table-header-group; }
      .print-area .sheet-table th { font-size: 8.5pt; }
      .print-area .sheet-table tr { break-inside: avoid; page-break-inside: avoid; }
      .print-area .sheet-table td { font-size: 11pt; }
      .print-area .sheet-table td.sc { height: 18mm; }
      .print-area .sheet-table .ln { height: 10mm; }
    }
</style>

<body>
  <div class="app">
    <header>
      <a class="home-link" href="index.html">← Accueil</a>
      <div class="brand"><span class="mark" aria-hidden="true">Fr</span> Français</div>
      <button class="icon-btn" id="soundToggle" type="button" aria-label="Couper le son" aria-pressed="true">🔊</button>
    </header>

    <main>
      <section class="panel">
        <div class="reaction-layer" id="reactionLayer" aria-hidden="true"></div>

        <!-- choose a lesson -->
        <div class="screen scrolly" id="homeScreen">
          <p class="eyebrow">📚 Mes leçons de français</p>
          <h1>Choisis ta leçon</h1>
          <p class="intro-copy">Lis la leçon ou écoute-la, puis joue pour montrer que tu as bien compris.</p>
          <div class="lesson-grid" id="lessonGrid"></div>
        </div>

        <!-- the lesson -->
        <div class="screen hidden" id="lessonScreen">
          <div class="lesson-scroll" id="lessonScroll"></div>
          <div class="lesson-actions">
            <button class="secondary" id="readBtn" type="button">🔊 Écouter</button>
            <button class="primary" id="playBtn" type="button">Jouer ! 🎲</button>
          </div>
          <button class="link-btn" id="lessonHome" type="button">← Toutes les leçons</button>

    /* =====================================================================
       QUESTION BANKS
       Sentences are chunks split by "|". A chunk can be tagged:
       V: verbe   S: sujet   T: indicateur de temps   N: nom
       P: nom propre   C: nom commun   (tags are never shown)
       ===================================================================== */
    const CHOICE = (answer, options, keep, extra) => Object.assign({ kind: "choice", answer, options, keep: !!keep }, extra || {});
    const ch = (prompt, answer, options, o = {}) => Object.assign({ prompt }, o, { steps: [CHOICE(answer, options, o.keep, { labels: o.labels, fill: o.fill })] });
    const chS = (sent, answer, options, o = {}) => Object.assign({ sent }, o, { steps: [CHOICE(answer, options, o.keep)] });
    const tap = (sent, target, o = {}) => Object.assign({ sent }, o, { steps: [{ kind: "tap", target }] });
    const multi = (sent, target, o = {}) => Object.assign({ sent }, o, { steps: [{ kind: "multi", target }] });
    const ord = (tiles, o = {}) => Object.assign({}, o, { noSay: true, steps: [{ kind: "order", tiles, block: !!o.block }] });
    // pronoun options match the blank: capitalised when the blank starts the sentence
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const pro = (prompt, answer, base, o = {}) => {
      const start = prompt.startsWith("___");
      return ch(prompt, start ? cap(answer) : answer, base.map((b) => start ? cap(b) : b), Object.assign({ keep: true }, o));
    };

    function bankL1() {
      const A = "Écoute le mot. Combien de syllabes ?";
      const CLAP = { "1": "👏", "2": "👏👏", "3": "👏👏👏", "4": "👏👏👏👏" };
      const clap = (w, split) => ch(w, String(split.split("-").length), ["1", "2", "3", "4"],
        { ask: A, keep: true, labels: CLAP, say: w, sheetA: `${split.split("-").length} syllabes : ${split}`, note: split.replace(/-/g, " · ") });
      const vow = (w) => multi(w.split("").map((l) => (/[aeiouyéèêàâîôû]/.test(l) ? "V:" : "") + l).join("|"),
        "V", { ask: "Tape toutes les voyelles.", say: w, letters: true });
      return [
        clap("chat", "chat"), clap("pain", "pain"), clap("lapin", "la-pin"), clap("vélo", "vé-lo"), clap("maison", "mai-son"),
        clap("papillon", "pa-pi-llon"), clap("éléphant", "é-lé-phant"), clap("chocolat", "cho-co-lat"), clap("école", "é-co-le"),
        clap("kangourou", "kan-gou-rou"), clap("ordinateur", "or-di-na-teur"), clap("coquelicot", "co-que-li-cot"), clap("télévision", "té-lé-vi-sion"),
        vow("lapin"), vow("vélo"), vow("tomate"), vow("girafe"), vow("pyjama"), vow("école"),
        ch("b", "consonne", ["voyelle", "consonne"], { ask: "Voyelle ou consonne ?", keep: true }),
        ch("o", "voyelle", ["voyelle", "consonne"], { ask: "Voyelle ou consonne ?", keep: true }),
        ch("y", "voyelle", ["voyelle", "consonne"], { ask: "Voyelle ou consonne ?", keep: true }),
        ch("m", "consonne", ["voyelle", "consonne"], { ask: "Voyelle ou consonne ?", keep: true }),
        ch("lapin", "5", ["4", "5", "6"], { ask: "Combien de lettres dans ce mot ?", keep: true }),
        ch("chat", "4", ["3", "4", "5"], { ask: "Combien de lettres dans ce mot ?", keep: true })
      ];
    }
    function bankL2() {
      const A = "Remets les mots dans l’ordre pour faire une phrase.";
      const o = (s) => ord(s.split("|"), { ask: A });
      const P = "Est-ce une phrase bien écrite ?";
      const yn = (s, ans, note) => ch(s, ans, ["oui", "non"], { ask: P, keep: true, note });
      return [
        o("Le|chat|dort|sur|le|lit|."), o("Ma|sœur|mange|une|pomme|."), o("Nous|allons|au|parc|."),
        o("Le|soleil|brille|dans|le|ciel|."), o("Papa|prépare|le|repas|."), o("Les|enfants|jouent|au|ballon|."),
        o("J’aime|avoir|un|stylo|neuf|."), o("Tom|lit|un|livre|."), o("La|maîtresse|écrit|au|tableau|."),
        o("Mon|chien|court|vite|."), o("Le|bébé|dort|dans|son|lit|."), o("Léa|dessine|un|chat|."),
        yn("Le chat dort.", "oui", "Une majuscule, un point et du sens : c’est une phrase !"),
        yn("le chat noir dort.", "non", "Il manque la majuscule au début."),
        yn("Lise joue au parc", "non", "Il manque le point à la fin."),
        yn("Dort chat le.", "non", "Les mots ne sont pas dans le bon ordre : ça n’a pas de sens."),
        yn("Je mange une glace.", "oui", "Une majuscule, un point et du sens : c’est une phrase !")
      ];
    }
    function bankL3() {
      const A = "Quel signe faut-il mettre à la fin ?";
      const L = { ".": ".<small>point</small>", "?": "?<small>question</small>", "!": "!<small>exclamation</small>" };
      const p = (s, mark) => ch(s + " ___", mark, [".", "?", "!"], { ask: A, keep: true, labels: L, big: true, say: s + (mark === "." ? "." : " " + mark) });
      const C = "Écoute bien les pauses. Où vont les virgules ?";
      const v = (good, bad1, bad2) => ch("", good, [good, bad1, bad2], { ask: C, say: good });
      return [
        p("Quelle belle surprise", "!"), p("Est-ce que tu viens à la piscine", "?"), p("Le chat dort sur le canapé", "."),
        p("Aïe, je me suis fait mal", "!"), p("Comment t’appelles-tu", "?"), p("Il pleut ce matin", "."),
        p("Où est mon cartable", "?"), p("Bravo, tu as gagné", "!"), p("Ma sœur a sept ans", "."),
        p("Veux-tu une glace", "?"), p("Oh, quelle jolie fleur", "!"), p("Nous mangeons à midi", "."),

        v("Dans ma trousse, il y a un stylo, une gomme et une règle.", "Dans ma trousse il y a un stylo une gomme, et une règle.", "Dans, ma trousse il y a un stylo, une gomme et une règle."),
        v("Le matin, je bois du lait.", "Le matin je bois, du lait.", "Le, matin je bois du lait.")

    }
    function bankL4() {
      const O = "Remets l’histoire dans l’ordre.";
      const T = "Quel est le bon titre pour ce texte ?";
      const story = (lines, title, wrong) => [
        ord(lines, { ask: O, block: true }),
        ch(lines.join(" "), title, [title, ...wrong], { ask: T, long: true })
      ];
      return [
        ...story(["Léo plante une graine.", "Il arrose la graine chaque jour.", "Une belle fleur pousse."], "La fleur de Léo", ["Le chat de Léo", "À la plage"]),
        ...story(["Ce matin, Lina se réveille.", "Elle prend son petit déjeuner.", "Puis elle part à l’école."], "Le matin de Lina", ["Le goûter de Lina", "La nuit de Lina"]),
        ...story(["Le chat voit une souris.", "Il court derrière elle.", "La souris se cache dans un trou."], "Le chat et la souris", ["Le chien et l’os", "La souris au marché"]),
        ...story(["Il fait chaud à la plage.", "Tom construit un château de sable.", "Une vague arrive et casse le château."], "Le château de sable", ["La neige", "Le château du roi"]),
        ...story(["Maman sort les œufs et la farine.", "Nous mélangeons tout dans un bol.", "Le gâteau cuit dans le four."], "Le gâteau", ["La soupe", "Le jardin"]),
        ...story(["Il neige dehors.", "Les enfants mettent leurs bonnets.", "Ils font un bonhomme de neige."], "Le bonhomme de neige", ["La plage", "Le gâteau d’anniversaire"]),
        ch("", "plusieurs phrases sur un sujet", ["plusieurs phrases sur un sujet", "un seul mot", "une liste de lettres"], { ask: "Un texte, c’est…" }),
        ch("", "je vais à la ligne", ["je vais à la ligne", "j’écris en rouge", "je mets un titre"], { ask: "À chaque nouvelle idée…" }),
        ch("", "un titre", ["un titre", "un point", "une virgule"], { ask: "En haut d’un texte, je mets…" })
      ];
    }
    function bankL5() {
      const N = "Tape tous les noms.";
      const K = ["une personne", "un animal", "un objet", "un lieu", "une émotion"];
      const k = (w, a) => ch(w, a, K, { ask: "Ce nom désigne…", keep: true });

      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    /* ---------- storage ---------- */
    const STORE_BEST = "francais.best.v1";
    const STORE_SOUND = "francais.sound.v1";
    function loadBest() { try { return JSON.parse(localStorage.getItem(STORE_BEST) || "{}") || {}; } catch (e) { return {}; } }
    function saveBest(b) { try { localStorage.setItem(STORE_BEST, JSON.stringify(b)); } catch (e) {} }
    let best = loadBest();
    let soundOn = (() => { try { return localStorage.getItem(STORE_SOUND) !== "off"; } catch (e) { return true; } })();
    const starsFor = (score) => score >= ROUND ? 3 : score >= ROUND - 2 ? 2 : score >= ROUND / 2 ? 1 : 0;
    const starHTML = (n) => "★".repeat(n) + `<span class="off">${"★".repeat(3 - n)}</span>`;

    /* ---------- speech ---------- */
    const speechOK = typeof window !== "undefined" && "speechSynthesis" in window;
    let frVoice = null;
    function pickFrenchVoice(voices) {
      const fr = voices.filter((v) => /^fr(-|_|$)/i.test(v.lang) || /fran[cç]ais|french/i.test(v.name));
      if (!fr.length) return null;
      const rank = (v) => {
        const n = (v.name || "").toLowerCase();
        let s = 0;
        if (/google/.test(n)) s += 6;
        if (/natural|neural|online/.test(n)) s += 5;
        if (/enhanced|premium|amélie|amelie|thomas|aurélie|aurelie|audrey|marie/.test(n)) s += 5;
        if (v.localService === false) s += 2;
        if (/compact|espeak|e-speak/.test(n)) s -= 6;
        if (/fr-fr/i.test(v.lang)) s += 1;
        return s;
      };
      const top = fr.slice().sort((a, b) => rank(b) - rank(a))[0];
      return rank(top) > 0 ? top : null;
    }
    function loadVoices() { if (!speechOK) return; try { frVoice = pickFrenchVoice(speechSynthesis.getVoices() || []); } catch (e) {} }
    // turn display text into something the voice reads naturally
    function speakText(s) {
      if (!s) return "";
      let t = s.replace(/\[\[.*?\]\]/g, "").replace(/==|\+\+|\*\*|__/g, "");
      t = t.replace(/_{3}/g, "…").replace(/[«»]/g, "").replace(/→/g, ",").replace(/\s[–—]\s/g, ", ").replace(/·/g, ",");
      t = /\+/.test(t) ? t.replace(/\+/g, " plus ").replace(/=/g, " égale ") : t.replace(/=/g, ":");
      t = t.replace(/\b1re\b/g, "première").replace(/\b2e\b/g, "deuxième").replace(/\b3e\b/g, "troisième");
      return t.replace(/[()]/g, ", ").replace(/\s+/g, " ").trim();
    }
    let seqToken = 0;
    function stopSpeech() { seqToken++; if (speechOK) { try { speechSynthesis.cancel(); } catch (e) {} } }
    // read several pieces one after the other; onLine(i) fires as piece i starts
    function speakSeq(texts, opts = {}) {
      if (!speechOK) { if (opts.onDone) opts.onDone(); return false; }
      if (!opts.essential && !soundOn) return false;
      stopSpeech();
      const tok = seqToken;
      let i = 0;
      const next = () => {
        if (tok !== seqToken) return;
        if (i >= texts.length) { if (opts.onDone) opts.onDone(); return; }
        const idx = i++;
        const t = speakText(texts[idx]);
        if (!t) { next(); return; }
        if (opts.onLine) opts.onLine(idx);
        try {
          const u = new SpeechSynthesisUtterance(t);
          u.lang = "fr-FR";
          if (frVoice) u.voice = frVoice;
          u.rate = 0.9;
          u.onend = next;
          u.onerror = next;
          speechSynthesis.speak(u);
        } catch (e) { next(); }
      };
      next();
      return true;
    }
    function updateSoundButton() {
      const b = $("soundToggle");
      b.textContent = soundOn ? "🔊" : "🔇";
      b.setAttribute("aria-pressed", String(soundOn));
      b.setAttribute("aria-label", soundOn ? "Couper le son" : "Activer le son");
    }

    /* ---------- lesson rendering ---------- */
    function md(s) {
      return esc(s)
        .replace(/\[\[(.+?)\]\]/g, '<span class="pbadge">$1</span>')
        .replace(/==(.+?)==/g, '<mark class="hl-o">$1</mark>')
        .replace(/\+\+(.+?)\+\+/g, '<mark class="hl-p">$1</mark>')
        .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
        .replace(/__(.+?)__/g, "<u>$1</u>");
    }
    // returns the rendered node plus the list of readable pieces [{node, say}]
    function renderLesson(lesson, opts = {}) {
      const root = el("div", "lesson-text");
      const units = [];
      const h = el("h2");
      h.textContent = /^\d+$/.test(lesson.n) ? `${lesson.n} – ${lesson.title}` : lesson.title;
      root.append(h);
      units.push({ node: h, say: lesson.title });
      lesson.text.forEach((item) => {
        const it = typeof item === "string" ? { t: item } : item;
        if (it.table) {
          const tb = el("table", "ltable");
          it.table.forEach((row) => {
            const tr = el("tr", "lline");
            const a = el("td"); a.innerHTML = esc(row[0]).replace(/(\d)(re|e)\b/, "$1<sup>$2</sup>");
            const b = el("td"); b.textContent = row[1];
            tr.append(a, b); tb.append(tr);
            units.push({ node: tr, say: row[2] });
          });
          root.append(tb);
          return;
        }
        const p = el("p", "lline" + (it.cls ? " " + it.cls : ""));
        p.innerHTML = md(it.t);
        if (it.cls === "box") p.classList.add("lbox");
        root.append(p);
        units.push({ node: p, say: it.s || it.t });
      });
      if (!opts.static) {
        units.forEach((u, i) => u.node.addEventListener("click", () => readLesson(units, i, true)));
      }
      return { root, units };
    }
    let reading = null; // { units, btns }
    function clearReading() {
      document.querySelectorAll(".lline.reading, h2.reading").forEach((n) => n.classList.remove("reading"));
    }
    function setReadButtons(on) {
      ["readBtn", "ovRead"].forEach((id) => { $(id).textContent = on ? "⏹ Arrêter" : "🔊 Écouter"; });
    }
    function readLesson(units, from, single) {
      const list = single ? [units[from]] : units.slice(from);
      clearReading();
      const ok = speakSeq(list.map((u) => u.say), {
        essential: true,
        onLine: (i) => { clearReading(); list[i].node.classList.add("reading"); list[i].node.scrollIntoView({ block: "nearest", behavior: "smooth" }); },
        onDone: () => { clearReading(); reading = null; setReadButtons(false); }
      });
      reading = ok && !single ? { units } : null;
      setReadButtons(!!reading);
    }
    function toggleRead(units) {
      if (reading) { stopSpeech(); clearReading(); reading = null; setReadButtons(false); return; }
      readLesson(units, 0, false);
    }
    function stopReading() { if (reading) { stopSpeech(); reading = null; } clearReading(); setReadButtons(false); }

    /* ---------- home ---------- */
    let lesson = null;
    let lessonUnits = [];
    function renderHome() {
      const grid = $("lessonGrid");
      grid.replaceChildren(...LESSONS.map((l) => {
        const b = el("button", "lcard");
        b.type = "button";
        b.style.setProperty("--c", l.c);
        const sc = best[l.id];
        b.innerHTML = `<span class="lnum">${esc(l.n)}</span><span class="ltitle">${esc(l.title)}</span>` +
          `<span class="lstars" aria-label="${sc == null ? "pas encore joué" : sc + " sur " + ROUND}">${starHTML(sc == null ? 0 : starsFor(sc))}</span>`;
        b.addEventListener("click", () => openLesson(l));
        return b;
      }));
    }
    function goHome() { stopReading(); stopSpeech(); clearReaction(); renderHome(); showOnly("homeScreen"); }

    /* ---------- lesson screen ---------- */
    function openLesson(l) {
      lesson = l;
      stopReading(); clearReaction();
      const r = renderLesson(l);
      lessonUnits = r.units;
      $("lessonScroll").replaceChildren(r.root);
      $("lessonScroll").scrollTop = 0;
      showOnly("lessonScreen");
    }

    /* ---------- sentence chunks ---------- */
    const PUNCT = /^[.,!?;:…]+$/;
    function parseSent(s) {
      return s.split("|").map((part) => {
        const m = /^([A-Z]):(.+)$/.exec(part);
        return m ? { k: m[1], t: m[2] } : { k: "", t: part };
      });
    }
    const glue = (prev, cur) => {
      if (!prev) return "";
      if (PUNCT.test(cur.t)) return /^[!?:;]/.test(cur.t) ? " " : "";
      if (/['’]$/.test(prev.t)) return "";
      return " ";
    };
    function plainSent(chunks) { return chunks.map((c, i) => glue(chunks[i - 1], c) + c.t).join(""); }
    function renderSent(chunks, o = {}) {
      const p = el("p", "sent" + (o.letters ? " letters" : ""));
      chunks.forEach((c, i) => {
        const g = o.letters ? "" : glue(chunks[i - 1], c);
        if (g) p.append(document.createTextNode(g));
        if (PUNCT.test(c.t) && !o.letters) { p.append(el("span", "punct", c.t)); return; }
        const span = el("span", "chunk");
        span.dataset.c = i;
        if (o.ul && c.k === o.ul) span.classList.add("ul");
        c.t.split(" ").forEach((w, j) => {
          if (j) span.append(document.createTextNode(" "));
          const ws = el("span", "w", w);
          ws.dataset.c = i;
          span.append(ws);
        });
        p.append(span);
      });
      return p;
    }

    /* ---------- game ---------- */
    let round = [], qi = 0, results = [], mistakes = [];
    let q = null, stepI = 0, qOk = true, locked = false, lastAsk = "", stepAnswers = [], advanceTimer = null;
    let chunks = [], sentEl = null, promptEl = null;

    function startGame() {
      if (!lesson) return;
      stopReading(); clearReaction();
      const bank = BANKS[lesson.id]();
      round = shuffle(bank).slice(0, Math.min(ROUND, bank.length));
      qi = 0; results = []; mistakes = []; lastAsk = "";
      showOnly("gameScreen");
      showQuestion();
    }
    function renderDots() {
      $("dots").replaceChildren(...round.map((_, i) => {
        const d = el("i");
        if (i < results.length) d.className = results[i] ? "good" : "bad";
        else if (i === qi) d.className = "now";
        return d;
      }));
      $("qCount").textContent = `${Math.min(qi + 1, round.length)} / ${round.length}`;
    }
    function promptHTML(text) {
      return esc(text).replace(/_{3}/, '<span class="blank" id="blank"> </span>');
    }
    function showQuestion() {
      clearTimeout(advanceTimer);
      q = round[qi]; stepI = 0; qOk = true; stepAnswers = []; locked = false;
      chunks = q.sent ? parseSent(q.sent) : [];
      const stage = $("qStage");
      stage.replaceChildren();
      $("qFoot").replaceChildren();
      sentEl = null; promptEl = null;
      if (q.emoji) stage.append(el("div", "q-emoji", q.emoji));
      if (q.sent) {
        sentEl = renderSent(chunks, { ul: q.ul, letters: q.letters });
        stage.append(sentEl);
      } else if (q.prompt) {
        promptEl = el("p", "q-prompt" + (q.long || q.prompt.length > 60 ? " long" : ""));
        promptEl.innerHTML = promptHTML(q.prompt);
        stage.append(promptEl);
      }
      renderDots();
      startStep(true);
    }
    function questionSpeech() {
      if (q.noSay) return "";
      if (q.say) return q.say;
      if (q.sent) return plainSent(chunks);
      return q.prompt || "";
    }
    function currentAsk() {
      const st = q.steps[stepI];
      return (stepI === 0 ? (q.ask || st.ask) : (st.ask || q.ask)) || "";
    }
    function startStep(first) {
      const st = q.steps[stepI];
      const ask = currentAsk();
      $("qAsk").textContent = ask;
      $("qFoot").replaceChildren();
      const stage = $("qStage");
      stage.querySelectorAll(".opts, .ord").forEach((n) => n.remove());
      if (sentEl) sentEl.classList.toggle("tappable", st.kind === "tap" || st.kind === "multi");
      if (st.kind === "choice") renderChoice(st);
      else if (st.kind === "multi") renderMulti(st);
      else if (st.kind === "order") renderOrder(st);
      // read aloud: the instruction when it changes, then the sentence
      const texts = [];
      if (ask !== lastAsk || !first) texts.push(ask);
      if (first) texts.push(questionSpeech());
      lastAsk = ask;
      speakSeq(texts);
    }
    function sayQuestion() {
      const texts = [currentAsk(), questionSpeech()];
      speakSeq(texts, { essential: true });
    }

    /* choice */
    function renderChoice(st) {
      const opts = st.keep ? st.options.slice() : shuffle(st.options);
      const long = opts.some((o) => o.length > 14) || q.long;
      const box = el("div", "opts");
      const cols = q.big ? 3 : long ? 1 : opts.length === 3 ? 3 : 2;
      box.style.setProperty("--cols", cols);
      opts.forEach((o) => {
        const b = el("button", "opt" + (long ? " long" : "") + (q.big ? " big" : ""));
        b.type = "button";
        if (st.labels && st.labels[o]) b.innerHTML = st.labels[o]; else b.textContent = o;
        b.dataset.v = o;
        b.addEventListener("click", () => answerChoice(st, b, box));
        box.append(b);
      });
      $("qStage").append(box);
    }
    function fillText(st) {
      const v = st.fill && Object.prototype.hasOwnProperty.call(st.fill, st.answer) ? st.fill[st.answer] : st.answer;
      return v;
    }
    function answerChoice(st, btn, box) {
      if (locked) return;
      locked = true;
      const ok = btn.dataset.v === st.answer;
      box.querySelectorAll(".opt").forEach((b) => {
        b.disabled = true;
        if (b.dataset.v === st.answer) b.classList.add("good");
      });
      if (!ok) btn.classList.add("bad");
      // fill the blank with the right answer
      const blank = document.getElementById("blank");
      if (blank && q.steps.length === 1) {
        const v = fillText(st);
        blank.textContent = v === "" ? " " : v;
        blank.classList.add("filled");
        if (v === "") blank.classList.add("empty");
      }
      stepDone(ok, choiceAnswerText(st));
    }
    function choiceAnswerText(st) {
      if (q.sheetA) return q.sheetA;
      if (q.prompt && /_{3}/.test(q.prompt)) {
        const v = fillText(st);
        return q.prompt.replace(/\s?_{3}/, (m) => (v === "" ? "" : m.startsWith(" ") ? " " + v : v))
          .replace(/\s*\([^)]*\)/g, "").replace(/\s+([.,])/g, "$1");
      }
      if (q.ul && chunks.length) {
        const c = chunks.find((x) => x.k === q.ul);
        if (q.infinitive) return `${c.t} → il faut ${st.answer}`;
        return `${c.t} → ${st.answer}`;
      }
      return st.answer;
    }

    /* tap (one answer) */
    function chunkNodes(i) { return sentEl ? sentEl.querySelectorAll(`.chunk[data-c="${i}"]`) : []; }
    function markChunk(i, cls) { chunkNodes(i).forEach((n) => n.classList.add(cls)); }
    function onTapWord(e) {
      const w = e.target.closest(".w");
      if (!w || !sentEl || !sentEl.contains(w) || locked) return;
      const st = q.steps[stepI];
      const i = Number(w.dataset.c);
      if (st.kind === "tap") {
        locked = true;
        const ok = chunks[i].k === st.target;
        const right = chunks.findIndex((c) => c.k === st.target);
        markChunk(right, "mk-" + st.target);
        markChunk(right, ok ? "mk-good" : "mk-show");
        if (!ok) markChunk(i, "mk-bad");
        const txt = chunks[right].t;
        stepDone(ok, st.lab ? `${st.lab} : ${txt}` : txt);
      } else if (st.kind === "multi") {
        chunkNodes(i).forEach((n) => n.classList.toggle("sel"));
        updateMultiButton();
      }
    }

    /* tap (several answers) */
    function renderMulti() {
      const btn = el("button", "primary", "Vérifier ✓");
      btn.type = "button"; btn.id = "checkBtn"; btn.disabled = true;
      btn.addEventListener("click", checkMulti);
      $("qFoot").append(btn);
    }
    function updateMultiButton() {
      const b = $("checkBtn");
      if (b) b.disabled = !sentEl.querySelector(".chunk.sel");
    }
    function checkMulti() {
      if (locked) return;
      locked = true;
      const st = q.steps[stepI];
      const chosen = new Set([...sentEl.querySelectorAll(".chunk.sel")].map((n) => Number(n.dataset.c)));
      const targets = chunks.map((c, i) => (c.k === st.target ? i : -1)).filter((i) => i >= 0);
      const ok = targets.length === chosen.size && targets.every((i) => chosen.has(i));
      sentEl.querySelectorAll(".chunk.sel").forEach((n) => n.classList.remove("sel"));
      targets.forEach((i) => markChunk(i, chosen.has(i) ? "mk-good" : "mk-show"));
      chosen.forEach((i) => { if (!targets.includes(i)) markChunk(i, "mk-bad"); });
      $("qFoot").replaceChildren();
      stepDone(ok, targets.map((i) => chunks[i].t).join(", "));
    }

    /* put in order */
    let ordState = null;
    function renderOrder(st) {
      const answer = st.tiles.slice();
      let pool = shuffle(answer.map((t, i) => ({ t, i })));
      let guard = 0;
      while (pool.every((p, k) => p.i === k) && guard++ < 10) pool = shuffle(pool);
      const wrap = el("div", "ord" + (st.block ? " block" : ""));
      const line = el("div", "ord-line");
      const poolEl = el("div", "ord-pool");
      wrap.append(line, poolEl);
      ordState = { st, line, poolEl, wrap, placed: [], pool };
      $("qStage").append(wrap);
      const btn = el("button", "primary", "Vérifier ✓");
      btn.type = "button"; btn.id = "checkBtn"; btn.disabled = true;
      btn.addEventListener("click", checkOrder);
      $("qFoot").append(btn);
      drawOrder();
    }
    function drawOrder() {
      const s = ordState;
      const mk = (item, from) => {
        const b = el("button", "tile", item.t);
        b.type = "button";
        b.addEventListener("click", () => {
          if (locked) return;
          if (from === "pool") { s.pool = s.pool.filter((x) => x !== item); s.placed.push(item); }
          else { s.placed = s.placed.filter((x) => x !== item); s.pool.push(item); }
          drawOrder();
        });
        return b;
      };
      s.line.replaceChildren(...s.placed.map((it) => mk(it, "line")));
      s.poolEl.replaceChildren(...s.pool.map((it) => mk(it, "pool")));
      s.poolEl.classList.toggle("hidden", s.pool.length === 0);
      const b = $("checkBtn");
      if (b) b.disabled = s.pool.length > 0;
    }
    function joinTiles(tiles) {
      return tiles.reduce((acc, t, i) => acc + (i === 0 ? "" : PUNCT.test(t) ? (/^[!?:;]/.test(t) ? " " : "") : " ") + t, "");
    }
    function checkOrder() {
      if (locked) return;
      locked = true;
      const s = ordState;
      const got = s.placed.map((x) => x.t);
      const ok = got.join("\u0001") === s.st.tiles.join("\u0001");
      s.wrap.classList.add("done", ok ? "good" : "bad");
      if (!ok) {
        // show the right order underneath
        const fix = el("div", "ord-line");
        fix.style.borderColor = "var(--green)"; fix.style.background = "#e6f8ef";
        s.st.tiles.forEach((t) => fix.append(el("span", "tile", t)));
        s.wrap.append(fix);
      }
      $("qFoot").replaceChildren();
      stepDone(ok, s.st.block ? s.st.tiles.join(" ") : joinTiles(s.st.tiles));
    }

    /* step / question flow */
    function stepDone(ok, answerText) {
      if (!ok) qOk = false;
      stepAnswers.push(answerText);
      if (stepI < q.steps.length - 1) {
        stepI++;
        setTimeout(() => { locked = false; startStep(false); }, ok ? 700 : 1500);
        return;
      }
      finishQuestion();
    }
    function questionText() {
      if (q.sent) return plainSent(chunks);
      const st = q.steps[0];
      if (st.kind === "order") return st.block ? "Remettre l’histoire dans l’ordre" : "Mots à remettre dans l’ordre : " + shuffle(st.tiles).join(" / ");
      if (q.emoji) return q.emoji;
      if (q.prompt) return q.prompt.replace(/_{3}/g, "…");
      return st.options.join(" · ");
    }
    function finishQuestion() {
      results.push(qOk);
      const answer = stepAnswers.join(" · ");
      if (!qOk) mistakes.push({ q: questionText(), ask: q.ask || q.steps[0].ask || "", a: answer });
      renderDots();
      react(qOk ? "good" : "bad", qOk ? 2 : 1);
      const foot = $("qFoot");
      foot.replaceChildren();
      const fb = el("p", "fb " + (qOk ? "good" : "bad"));
      if (qOk) {
        fb.innerHTML = "Bravo ! ✨" + (q.note ? `<small>${esc(q.note)}</small>` : "");
      } else {
        fb.innerHTML = `La bonne réponse : <span class="ans">${esc(answer)}</span>` + (q.note ? `<small>${esc(q.note)}</small>` : "");
      }
      foot.append(fb);
      if (qOk) {
        advanceTimer = setTimeout(nextQuestion, q.note ? 2200 : 1400);
      } else {
        const nb = el("button", "primary", qi + 1 < round.length ? "Question suivante →" : "Voir mon score →");
        nb.type = "button";
        nb.addEventListener("click", nextQuestion);
        foot.append(nb);
      }
    }
    function nextQuestion() {
      clearTimeout(advanceTimer);
      if ($("gameScreen").classList.contains("hidden")) return;
      qi += 1;
      if (qi >= round.length) finishGame(); else showQuestion();
    }

    /* lesson overlay during the game */
    let overlayUnits = [];
    function openOverlay() {
      stopSpeech();
      clearTimeout(advanceTimer);
      const r = renderLesson(lesson);
      overlayUnits = r.units;
      $("overlayScroll").replaceChildren(r.root);
      $("overlayScroll").scrollTop = 0;
      $("lessonOverlay").classList.remove("hidden");
    }
    function closeOverlay() {
      stopReading();
      $("lessonOverlay").classList.add("hidden");
      // a correct answer that was waiting to move on
      if (results.length > qi && results[qi]) advanceTimer = setTimeout(nextQuestion, 400);
    }

    /* ---------- end ---------- */
    function finishGame() {
      stopSpeech();
      const score = results.filter(Boolean).length;
      const prev = best[lesson.id];
      if (prev == null || score > prev) { best[lesson.id] = score; saveBest(best); }
      const stars = starsFor(score);
      $("trophy").textContent = score === round.length ? "🏆" : stars >= 2 ? "🌟" : stars === 1 ? "💪" : "📖";
      $("endLesson").textContent = /^\d+$/.test(lesson.n) ? `Leçon ${lesson.n} · ${lesson.title}` : lesson.title;
      $("endScore").textContent = `${score} / ${round.length}` + (score === round.length ? " — parfait !" : "");
      $("endStars").innerHTML = starHTML(stars);
      const list = $("mistakeList");
      list.replaceChildren(...mistakes.map((m) => {
        const r = el("div", "mrow");
        r.append(el("div", "mq", m.q), el("div", "ma", "✓ " + m.a));
        return r;
      }));
      $("mistakeBlock").classList.toggle("hidden", mistakes.length === 0);
      $("openSheet").classList.toggle("hidden", mistakes.length === 0);
      makeConfetti();
      showOnly("endScreen");
      $("endScreen").scrollTop = 0;
      if (mistakes.length === 0) react("good", 8); else react("bad", mistakes.length);
    }
    function makeConfetti() {
      const colors = ["#7c4dff", "#ff5d8f", "#36d1c4", "#ffd84d", "#ff8a4c"];
      $("confetti").replaceChildren(...Array.from({ length: 32 }, (_, i) => {
        const p = el("i");
        p.style.setProperty("--x", `${(i * 37) % 100}%`);
        p.style.setProperty("--c", colors[i % colors.length]);
        p.style.setProperty("--d", `${2.8 + (i % 5) * .35}s`);
        p.style.setProperty("--delay", `${-(i % 7) * .4}s`);
        return p;
      }));
    }

    /* ---------- corrections sheet ---------- */
    function buildSheet() {
      const date = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
      const sheet = el("div", "sheet");
      const head = el("div", "sheet-head");
      head.append(el("div", "sheet-title", "Mes corrections ✏️"), el("div", "sheet-meta", `Français · ${/^\d+$/.test(lesson.n) ? "Leçon " + lesson.n + " : " : ""}${lesson.title} · ${date}`));
      const box = el("div", "sheet-lesson");
      box.append(renderLesson(lesson, { static: true }).root);
      const table = el("table", "sheet-table");
      const cols = el("colgroup");
      cols.append(el("col", "c-q"), el("col", "c-a"), el("col"));
      const thead = el("thead");
      const hr = el("tr");
      ["La question", "La bonne réponse", "Je recopie la bonne réponse"].forEach((t) => hr.append(el("th", null, t)));
      thead.append(hr);
      const tbody = el("tbody");
      mistakes.forEach((m) => {
        const tr = el("tr");
        const tq = el("td");
        if (m.ask) tq.append(el("small", null, m.ask));
        tq.append(document.createTextNode(m.q));
        const tc = el("td", "sc");
        tc.append(el("div", "ln"));
        tr.append(tq, el("td", "sa", m.a), tc);
        tbody.append(tr);
      });
      table.append(cols, thead, tbody);
      sheet.append(head, box, el("p", "sheet-instr", "Je relis la leçon, puis je recopie la bonne réponse."), table);
      return sheet;
    }
    function openSheet() {
      if (!mistakes.length) return;
      $("sheetWrap").replaceChildren(buildSheet());
      $("printArea").replaceChildren(buildSheet());
      clearReaction();
      showOnly("sheetScreen");
      $("sheetWrap").scrollTop = 0;
    }

    /* ---------- reactions ---------- */
    let reactionTimer;
    function addCreature(layer, emoji, cls, left, top, delay) {
      const c = document.createElement("span");
      c.className = "creature " + cls;
      c.textContent = emoji;
      c.style.left = left; c.style.top = top; c.style.animationDelay = delay || "0s";
      layer.appendChild(c);
    }
    function clearReaction() { clearTimeout(reactionTimer); const l = $("reactionLayer"); if (l) l.replaceChildren(); }
    function react(kind, magnitude) {
      const layer = $("reactionLayer");
      if (!layer) return;
      clearTimeout(reactionTimer);
      layer.replaceChildren();
      const label = document.createElement("strong");
      if (kind === "good") {
        label.className = "reaction-label good";
        label.textContent = "Bravo ! 🌟";
        const n = Math.max(3, Math.min(10, magnitude || 4));
        for (let i = 0; i < n; i++) addCreature(layer, i % 2 ? "🌈" : "🦄", "good-pop", (5 + (i * 83) % 88) + "%", (6 + (i * 47) % 72) + "%", (i * 0.12) + "s");
      } else {
        label.className = "reaction-label bad";
        label.textContent = magnitude > 1 ? "Oups… à revoir" : "Presque !";
        const n = Math.max(1, Math.min(8, magnitude || 1));
        for (let i = 0; i < n; i++) addCreature(layer, "🦨", "skunk-run", "-5%", (10 + (i * 61) % 74) + "%", (i * 0.16) + "s");
        for (let i = 0; i < Math.min(3, n); i++) addCreature(layer, "💨", "puff", (18 + i * 28) + "%", (38 + (i * 17) % 50) + "%", (i * 0.2 + 0.1) + "s");
      }
      layer.appendChild(label);
      reactionTimer = setTimeout(() => layer.replaceChildren(), 1900);
    }

    /* ---------- wire up ---------- */
    if (speechOK) {
      loadVoices();
      try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {}
    } else {
      ["soundToggle", "readBtn", "ovRead", "gSay"].forEach((id) => $(id).classList.add("hidden"));
    }
    updateSoundButton();
    renderHome();
    showOnly("homeScreen");

    $("soundToggle").addEventListener("click", () => {
      soundOn = !soundOn;
      if (!soundOn) stopReading(), stopSpeech();
      updateSoundButton();
      try { localStorage.setItem(STORE_SOUND, soundOn ? "on" : "off"); } catch (e) {}
    });
    $("readBtn").addEventListener("click", () => toggleRead(lessonUnits));
    $("playBtn").addEventListener("click", startGame);
    $("lessonHome").addEventListener("click", goHome);
    $("qStage").addEventListener("click", onTapWord);
    $("gSay").addEventListener("click", sayQuestion);
    $("gLesson").addEventListener("click", openOverlay);
    $("ovClose").addEventListener("click", closeOverlay);
    $("ovRead").addEventListener("click", () => toggleRead(overlayUnits));
    $("openSheet").addEventListener("click", openSheet);
    $("replayBtn").addEventListener("click", startGame);
    $("endLessonBtn").addEventListener("click", () => openLesson(lesson));
    $("endHome").addEventListener("click", goHome);
    $("sheetBack").addEventListener("click", () => showOnly("endScreen"));
    $("sheetPrint").addEventListener("click", () => { try { window.print(); } catch (e) {} });
  </script>
<script data-goatcounter="https://dimitrib-real.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
